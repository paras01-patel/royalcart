{% extends 'base.html' %}

{% block title %}Signup{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="height:80vh;">
    
    <div class="card p-4 shadow" style="width:350px;">
        <h3 class="text-center mb-3 text-primary">Create Account</h3>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Username" class="form-control mb-3" required>
            <input type="email" name="email" placeholder="Email" class="form-control mb-3" required>
            <input type="password" name="password" placeholder="Password" class="form-control mb-3" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" class="form-control mb-3" required>

            <button class="btn btn-primary w-100">Signup</button>
        </form>

        <p class="text-center mt-3">
            Already have account? <a href="/login" class="text-primary">Login</a>
        </p>
    </div>

</div>

{% endblock %}
